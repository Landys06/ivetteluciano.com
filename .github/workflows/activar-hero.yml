name: Activar portada Ivette Luciano

on:
  push:
    branches:
      - 'https/landys06.github.io/ivetteluciano.com'

permissions:
  contents: write

jobs:
  activar-portada:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar sitio
        uses: actions/checkout@v4

      - name: Activar CSS de portada
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="ajuste-final-hero.css?v=1">'

          if marker not in text:
              target = '<link rel="stylesheet" href="estilos.css?v=3">'
              if target not in text:
                  raise SystemExit('No se encontró el enlace de estilos.css?v=3')
              text = text.replace(target, target + '\n  ' + marker, 1)
              path.write_text(text, encoding='utf-8')
              print('Portada activada.')
          else:
              print('La portada ya estaba activada.')
          PY

      - name: Guardar cambio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Sin cambios que guardar.'
          else
            git commit -m 'Activar portada con foto original a la derecha'
            git push
          fi
